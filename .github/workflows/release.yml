name: Release desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Validate tag version
        if: github.event_name == 'push'
        shell: bash
        run: |
          expected_tag="$(bun -e 'const pkg = await Bun.file("package.json").json(); process.stdout.write(`v${pkg.version}`)')"
          test "$GITHUB_REF_NAME" = "$expected_tag"
      - name: Set application version
        shell: bash
        run: echo "OH_YOUR_PI_VERSION=$(bun -e 'const pkg = await Bun.file("package.json").json(); process.stdout.write(pkg.version)')" >> "$GITHUB_ENV"
      - name: Build release
        # Electrobun only signs macOS targets; "-" selects an ad hoc signature.
        env:
          OH_YOUR_PI_CODESIGN: "true"
          ELECTROBUN_DEVELOPER_ID: "-"
        run: bun run build:stable
      - uses: actions/upload-artifact@v6
        with:
          name: release-v${{ env.OH_YOUR_PI_VERSION }}-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
